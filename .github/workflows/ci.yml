name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: # the two systems the README names
          - { os: ubuntu-latest, name: check } # "check" is the name that the protection of main requires
          - { os: macos-latest, name: check-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build && ./dist/milhouse --version # what a release ships has to build and start
